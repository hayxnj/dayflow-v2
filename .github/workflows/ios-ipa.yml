name: Build iOS app package

on:
  push:
    branches:
      - mobile-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out mobile app branch
        uses: actions/checkout@v4
        with:
          ref: mobile-app

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JavaScript dependencies
        run: npm install

      - name: Generate iOS project
        run: npx cap add ios

      - name: Sync web app into iOS project
        run: npx cap sync ios

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Debug-iphoneos/App.app build/Payload/App.app
          cd build
          zip -r Dayflow-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: dayflow-ios-unsigned
          path: build/Dayflow-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
